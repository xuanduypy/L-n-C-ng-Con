<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Warm Sunny Yellow Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="35%" stop-color="#FEF08A"/>
      <stop offset="100%" stop-color="#FDE047"/>
    </linearGradient>

    <!-- Flutter-inspired Cyan-Blue Ribbon Gradients -->
    <!-- Top Ribbon / Upward Arrow Facet -->
    <linearGradient id="flutterCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#54C5F8"/>
      <stop offset="100%" stop-color="#29B6F6"/>
    </linearGradient>

    <!-- Mid Spine / Vertical Column -->
    <linearGradient id="flutterBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#027DFD"/>
      <stop offset="100%" stop-color="#01579B"/>
    </linearGradient>

    <!-- Bottom Return Ribbon -->
    <linearGradient id="flutterDeep" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#02569B"/>
      <stop offset="100%" stop-color="#013B6B"/>
    </linearGradient>

    <!-- Overlap / Angular Cross Ribbon -->
    <linearGradient id="flutterBright" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#40C4FF"/>
      <stop offset="50%" stop-color="#0288D1"/>
      <stop offset="100%" stop-color="#01579B"/>
    </linearGradient>

    <!-- Gold Accent Star -->
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <!-- Soft Drop Shadows for 3D Layering -->
    <filter id="softShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#78350F" flood-opacity="0.20"/>
    </filter>

    <filter id="innerFoldShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="-4" dy="6" stdDeviation="8" flood-color="#001B3A" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Base Squircle with Warm Yellow Tone -->
  <rect width="512" height="512" rx="124" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="120" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-opacity="0.6"/>

  <!-- Flutter Geometric Origami "D" Icon Group -->
  <g filter="url(#softShadow)">
    <!-- 1. Vertical Spine of Letter D (Left pillar) -->
    <path d="M 128 116 
             L 194 116 
             L 194 396 
             L 128 396 
             Z" 
          fill="url(#flutterBlue)" 
          rx="6"/>

    <!-- 2. Top Diagonal Wing / Upper Ribbon (Flutter-inspired 45° fold) -->
    <path d="M 194 116 
             L 300 116 
             L 384 200 
             L 318 200 
             L 252 134 
             L 194 134 
             Z" 
          fill="url(#flutterCyan)"/>

    <!-- 3. Curved / Faceted Outer Bow of the "D" -->
    <path d="M 300 116
             C 378 116 414 168 414 256
             C 414 344 378 396 300 396
             L 220 396
             L 282 334
             C 328 334 350 304 350 256
             C 350 208 328 178 282 178
             L 232 178
             L 194 140
             L 250 140
             C 272 120 286 116 300 116
             Z"
          fill="url(#flutterBright)"
          filter="url(#innerFoldShadow)"/>

    <!-- 4. Lower Diagonal Return Ribbon (Crossing Origami Fold like Flutter's lower wing) -->
    <path d="M 194 396
             L 300 396
             L 384 312
             L 318 312
             L 252 378
             L 194 378
             Z"
          fill="url(#flutterDeep)"/>

    <!-- 5. Flutter Signature Chevron Fold (Accent diamond-fold crossing the D center) -->
    <path d="M 194 256
             L 262 188
             L 326 252
             L 258 320
             Z"
          fill="url(#flutterCyan)"
          opacity="0.95"/>
    <path d="M 258 320
             L 326 252
             L 286 212
             L 218 280
             Z"
          fill="url(#flutterDeep)"
          opacity="0.7"/>

    <!-- 6. Playful Musical Note / Sparkle Inside DiNo's Core -->
    <circle cx="262" cy="254" r="14" fill="#FFFFFF"/>
    <circle cx="262" cy="254" r="9" fill="url(#goldAccent)"/>
  </g>

  <!-- Subtle corner sparkle for friendliness -->
  <path d="M 104 88 L 108 100 L 120 104 L 108 108 L 104 120 L 100 108 L 88 104 L 100 100 Z" fill="#CA8A04" opacity="0.45"/>
  <path d="M 424 96 L 427 106 L 437 109 L 427 112 L 424 122 L 421 112 L 411 109 L 421 106 Z" fill="#CA8A04" opacity="0.45"/>
</svg>
