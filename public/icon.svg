<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Soft light yellow background gradient -->
    <linearGradient id="yellowBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEFCE8"/>
      <stop offset="40%" stop-color="#FEF08A"/>
      <stop offset="100%" stop-color="#FDE047"/>
    </linearGradient>
    <!-- Golden puppy fur gradient -->
    <linearGradient id="furGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="60%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="earGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#78350F" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- Light Yellow Background (Squircle) -->
  <rect width="512" height="512" rx="128" fill="url(#yellowBg)"/>
  
  <!-- Subtle decorative sparkles -->
  <path d="M96 90 L100 108 L118 112 L100 116 L96 134 L92 116 L74 112 L92 108 Z" fill="#CA8A04" opacity="0.45"/>
  <path d="M414 96 L418 110 L432 114 L418 118 L414 132 L410 118 L396 114 L410 110 Z" fill="#CA8A04" opacity="0.45"/>
  <circle cx="85" cy="200" r="7" fill="#EAB308" opacity="0.35"/>
  <circle cx="430" cy="210" r="8" fill="#EAB308" opacity="0.35"/>

  <!-- Character Group -->
  <g filter="url(#shadow)">
    <!-- Floppy Ears (Left & Right) -->
    <path d="M124 195 C78 245 78 345 138 375 C168 390 190 325 180 260 Z" fill="url(#earGrad)"/>
    <path d="M388 195 C434 245 434 345 374 375 C344 390 322 325 332 260 Z" fill="url(#earGrad)"/>

    <!-- Puppy Head -->
    <ellipse cx="256" cy="265" rx="136" ry="122" fill="url(#furGrad)"/>

    <!-- Forehead tuft -->
    <path d="M236 150 Q256 128 276 150 Q266 142 256 144 Q246 142 236 150 Z" fill="#FDE68A"/>

    <!-- Cheek Blush -->
    <ellipse cx="172" cy="305" rx="22" ry="14" fill="#F43F5E" opacity="0.35"/>
    <ellipse cx="340" cy="305" rx="22" ry="14" fill="#F43F5E" opacity="0.35"/>

    <!-- Snout / Muzzle -->
    <ellipse cx="256" cy="315" rx="60" ry="44" fill="#FFFBEB"/>

    <!-- Nose -->
    <ellipse cx="256" cy="292" rx="21" ry="14" fill="#1E293B"/>
    <ellipse cx="251" cy="288" rx="6" ry="3.5" fill="#FFFFFF" opacity="0.85"/>

    <!-- Puppy Mouth -->
    <path d="M256 306 Q240 324 224 318" fill="none" stroke="#1E293B" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M256 306 Q272 324 288 318" fill="none" stroke="#1E293B" stroke-width="4.5" stroke-linecap="round"/>
    <!-- Cute open tongue -->
    <path d="M245 321 C245 340 267 340 267 321 Z" fill="#FB7185"/>

    <!-- Puppy Eyes -->
    <ellipse cx="194" cy="240" rx="18" ry="24" fill="#0F172A"/>
    <ellipse cx="318" cy="240" rx="18" ry="24" fill="#0F172A"/>
    
    <!-- Big Eye Highlights -->
    <circle cx="188" cy="232" r="7.5" fill="#FFFFFF"/>
    <circle cx="199" cy="247" r="3.5" fill="#FFFFFF"/>
    <circle cx="312" cy="232" r="7.5" fill="#FFFFFF"/>
    <circle cx="323" cy="247" r="3.5" fill="#FFFFFF"/>

    <!-- Eyebrows -->
    <ellipse cx="192" cy="202" rx="14" ry="7" fill="#FDE68A" transform="rotate(-10 192 202)"/>
    <ellipse cx="320" cy="202" rx="14" ry="7" fill="#FDE68A" transform="rotate(10 320 202)"/>
  </g>
</svg>
